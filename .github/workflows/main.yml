name: 编译 OpenWrt / LEDE

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      target:
        description: '选择编译目标'
        required: true
        default: 'both'
        type: choice
        options:
          - 'openwrt'
          - 'lede'
          - 'both'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPLOAD_RELEASE: true
  UPLOAD_FIRMWARE: true

jobs:
  build:
    name: 编译 ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: openwrt
            name: OpenWrt 官方版
            repo_url: https://github.com/openwrt/openwrt
            repo_branch: main
            config_dir: openwrt
            release_prefix: openwrt
            default_password: "无"
            
          - target: lede
            name: LEDE
            repo_url: https://github.com/coolsnowwolf/lede
            repo_branch: master
            config_dir: lede
            release_prefix: lede
            default_password: "无"

    steps:
      # ============================================
      # 1. 环境准备
      # ============================================
      - name: 释放磁盘空间
        run: |
          echo "=== 释放前磁盘空间 ==="
          df -h
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android \
            /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/.ghcup /usr/local/.cargo \
            /usr/local/lib/python3.* /usr/local/aws-sam-cli /usr/local/aws-cli /usr/local/julia* \
            /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/kotlinc /opt/microsoft \
            /opt/google /var/lib/gems /opt/pipx /opt/amazon 2>/dev/null || true
          echo "=== 释放后磁盘空间 ==="
          df -h

      - name: 检出仓库代码
        uses: actions/checkout@v5

      # ============================================
      # 2. 调试：查看文件结构
      # ============================================
      - name: 查看文件结构（调试）
        run: |
          echo "========================================="
          echo "📁 仓库文件结构"
          echo "========================================="
          echo "当前目录: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo ""
          echo "=== 根目录文件 ==="
          ls -la
          echo ""
          echo "=== openwrt 目录 ==="
          ls -la openwrt/ 2>/dev/null || echo "❌ openwrt 目录不存在"
          echo ""
          echo "=== lede 目录 ==="
          ls -la lede/ 2>/dev/null || echo "❌ lede 目录不存在"
          echo ""
          echo "=== 搜索 diy1.sh ==="
          find . -name "diy1.sh" 2>/dev/null | head -10
          echo ""
          echo "=== 搜索 diy2.sh ==="
          find . -name "diy2.sh" 2>/dev/null | head -10
          echo ""
          echo "=== 搜索 .config ==="
          find . -name ".config" 2>/dev/null | head -10
          echo "========================================="

      - name: 设置日期变量
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "date1=$(date +'%Y.%m.%d-%H.%M')" >> $GITHUB_ENV
          echo "date2=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "date3=$(date '+%Y年%m月%d日')" >> $GITHUB_ENV
          echo "✅ 日期: $(date '+%Y年%m月%d日')"

      - name: 安装编译依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential asciidoc binutils bzip2 gawk gettext git \
            libncurses5-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 \
            subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev \
            texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool \
            autopoint device-tree-compiler g++-multilib antlr3 gperf wget curl swig rsync
          echo "✅ 依赖安装完成"
          df -h

      # ============================================
      # 3. 克隆源码
      # ============================================
      - name: 克隆 ${{ matrix.name }} 源码
        run: |
          rm -rf ${{ matrix.target }}
          git clone --depth 1 ${{ matrix.repo_url }} -b ${{ matrix.repo_branch }} ${{ matrix.target }}
          echo "✅ ${{ matrix.name }} 源码克隆完成"

      # ============================================
      # 4. 执行 diy1.sh（首次自定义）
      # ============================================
      - name: 执行 diy1.sh
        run: |
          # 调试：显示当前状态
          echo "========================================="
          echo "🔧 执行 diy1.sh 前的调试信息"
          echo "========================================="
          echo "当前目录: $(pwd)"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo ""
          echo "=== 检查 ${{ matrix.config_dir }}/diy1.sh ==="
          if [ -f "${{ matrix.config_dir }}/diy1.sh" ]; then
            echo "✅ 文件存在: ${{ matrix.config_dir }}/diy1.sh"
            ls -la "${{ matrix.config_dir }}/diy1.sh"
          else
            echo "❌ 文件不存在: ${{ matrix.config_dir }}/diy1.sh"
          fi
          echo ""
          echo "=== 检查 \$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh ==="
          if [ -f "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh" ]; then
            echo "✅ 文件存在: $GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh"
            ls -la "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh"
          else
            echo "❌ 文件不存在: $GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh"
          fi
          echo "========================================="
          
          # 确保在仓库根目录
          cd $GITHUB_WORKSPACE
          
          echo "========================================="
          echo "📦 ${{ matrix.name }} 第三方插件清单"
          echo "========================================="
          
          if [ -f "${{ matrix.config_dir }}/diy1.sh" ]; then
            echo ""
            echo "🔍 diy1.sh 中包含的 GitHub 仓库："
            echo "-----------------------------------------"
            grep -E "github\.com|git clone" "${{ matrix.config_dir }}/diy1.sh" 2>/dev/null | \
              grep -v "^#" | head -20 || echo "  (未检测到 git clone 命令)"
            echo "-----------------------------------------"
            echo ""
          else
            echo "⚠️ 文件 ${{ matrix.config_dir }}/diy1.sh 不存在，跳过插件添加"
          fi
          
          # 进入源码目录
          cd ${{ matrix.target }}
          
          # 复制 feeds 配置
          if [ -f "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/feeds.conf.default" ]; then
            if [ ! -f "./feeds.conf.default" ]; then
              cp "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/feeds.conf.default" ./
              echo "✅ feeds.conf.default 已复制"
            fi
          fi
          
          # 执行 diy1.sh
          if [ -f "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh" ]; then
            echo ""
            echo "🚀 开始执行 diy1.sh..."
            echo "========================================="
            chmod +x "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh"
            "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh"
            echo "========================================="
            echo "✅ diy1.sh 执行完成"
          else
            echo "⚠️ 跳过 diy1.sh（文件不存在）"
          fi

      # ============================================
      # 5. 更新 feeds
      # ============================================
      - name: 更新 feeds
        run: |
          cd ${{ matrix.target }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "✅ feeds 更新完成"

      # ============================================
      # 6. 执行 diy2.sh（再次自定义）
      # ============================================
      - name: 执行 diy2.sh
        run: |
          cd ${{ matrix.target }}
          echo "========================================="
          echo "🔧 执行 diy2.sh"
          echo "========================================="
          if [ -f "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy2.sh" ]; then
            echo "✅ 找到 diy2.sh"
            chmod +x "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy2.sh"
            "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy2.sh"
            echo "✅ diy2.sh 执行完成"
          else
            echo "⚠️ 跳过 diy2.sh（文件不存在）"
          fi

      # ============================================
      # 7. 加载配置
      # ============================================
      - name: 加载配置
        run: |
          echo "========================================="
          echo "🔧 加载配置文件"
          echo "========================================="
          if [ -f "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/.config" ]; then
            cp "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/.config" ${{ matrix.target }}/.config
            echo "✅ 配置文件已复制"
          else
            echo "⚠️ 配置文件不存在，使用默认配置"
          fi
          cd ${{ matrix.target }}
          make defconfig
          echo "✅ defconfig 执行完成"

      - name: 验证目标设备
        run: |
          cd ${{ matrix.target }}
          echo "=== 目标设备配置 ==="
          grep -E "^CONFIG_TARGET_(x86|mediatek|rockchip|ipq)" .config 2>/dev/null | head -5 || echo "未找到目标设备配置"

      # ============================================
      # 8. 缓存加速
      # ============================================
      - name: 缓存加速
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ matrix.target }}/dl
            ${{ matrix.target }}/staging_dir
            ${{ matrix.target }}/build_dir
          key: ${{ matrix.target }}-x86-64-${{ hashFiles(format('{0}/.config', matrix.config_dir), format('{0}/diy1.sh', matrix.config_dir), format('{0}/diy2.sh', matrix.config_dir)) }}
          restore-keys: |
            ${{ matrix.target }}-x86-64-
            ${{ matrix.target }}-

      - name: 显示缓存状态
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "✅ 缓存命中！编译将显著加速"
          else
            echo "⚠️ 缓存未命中，进行完整编译"
          fi

      # ============================================
      # 9. 下载源码包
      # ============================================
      - name: 下载源码包
        run: |
          cd ${{ matrix.target }}
          echo "=== 下载源码包 ==="
          make download -j8 V=s || make download -j4 V=s || make download -j1 V=s || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true
          make download -j1 V=s 2>/dev/null || true
          echo "✅ 下载完成"

      # ============================================
      # 10. 编译前清理
      # ============================================
      - name: 编译前清理
        run: |
          cd ${{ matrix.target }}
          rm -rf tmp bin/packages 2>/dev/null || true
          echo "=== 当前磁盘空间 ==="
          df -h .

      # ============================================
      # 11. 编译固件
      # ============================================
      - name: 编译固件
        id: compile
        run: |
          cd ${{ matrix.target }}
          echo "=== 开始编译，使用 $(nproc) 线程 ==="
          
          make -j$(nproc) || make -j1 || make -j1 V=s
          
          BIN_COUNT=$(find bin/targets -name "*.bin" 2>/dev/null | wc -l)
          if [ "$BIN_COUNT" -gt 0 ]; then
            echo "✅ 固件编译成功（生成 $BIN_COUNT 个固件文件）"
          else
            echo "❌ 未找到固件文件"
            exit 1
          fi
          
          make package/index V=s 2>/dev/null || true
          make checksum V=s 2>/dev/null || true
          
          echo "status=success" >> $GITHUB_OUTPUT
          
          grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV || echo "DEVICE_NAME=generic" >> $GITHUB_ENV
          echo "✅ 设备名称: $DEVICE_NAME"

      # ============================================
      # 12. 检查磁盘
      # ============================================
      - name: 检查磁盘使用情况
        if: (!cancelled())
        run: |
          df -h
          du -sh ${{ matrix.target }} 2>/dev/null || true

      # ============================================
      # 13. 整理固件
      # ============================================
      - name: 整理固件
        id: organize
        if: steps.compile.outcome == 'success'
        run: |
          mkdir -p firmware
          
          cp -v ./${{ matrix.target }}/.config firmware/${{ env.date1 }}_${{ matrix.target }}_${{ env.DEVICE_NAME }}.config
          
          find ${{ matrix.target }}/bin/targets -type f \
            \( -name "*.bin" -o -name "*.img.gz" -o -name "*.vmdk" -o -name "*.vdi" \
            -o -name "*.vhdx" -o -name "*.qcow2" -o -name "config.buildinfo" \) \
            -exec cp -v {} firmware/ \; 2>/dev/null || true
          
          cd firmware
          
          for f in *; do
            if [ -f "$f" ]; then
              case "$f" in
                config.buildinfo)
                  mv "$f" "${{ env.date1 }}_${{ matrix.target }}_${{ env.DEVICE_NAME }}_$f" 2>/dev/null || true
                  ;;
                *.bin|*.img.gz)
                  mv "$f" "${{ env.date1 }}_${{ matrix.target }}_$f" 2>/dev/null || true
                  ;;
              esac
            fi
          done
          
          ls -la
          
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 固件整理完成"

      # ============================================
      # 14. 上传 Artifact
      # ============================================
      - name: 上传固件到 Artifact
        if: steps.organize.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}_${{ env.DEVICE_NAME }}_${{ env.date1 }}
          path: ${{ env.FIRMWARE }}

      # ============================================
      # 15. 生成 Release 描述
      # ============================================
      - name: 生成 Release 描述
        id: release
        if: steps.organize.outcome == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          CACHE_STATUS="${{ steps.cache.outputs.cache-hit == 'true' && '✅ 命中' || '⚠️ 未命中' }}"
          
          cat > release.txt <<EOF
          ## ${{ matrix.name }} 固件
          
          ### 📥 基本信息
          | 项目 | 值 |
          |------|-----|
          | 默认 IP | 192.168.5.1 |
          | 默认密码 | ${{ matrix.default_password }} |
          | 默认主题 | Argon |
          | 默认语言 | ${{ matrix.target == 'lede' && '简体中文（自带）' || '简体中文' }} |
          | IPv6 | ✅ 已启用 |
          | 内核版本 | ${{ matrix.target == 'lede' && '6.12' || '跟随官方最新' }} |
          | 编译日期 | ${{ env.date3 }} |
          | 缓存状态 | $CACHE_STATUS |
          
          ### 📦 集成插件
          PassWall、Lucky、关机按钮、访问限制、内存释放、
          DDNS（Cloudflare）、磁盘管理、Samba4、TTYD、
          ZeroTier、UDPXY、KMS服务器、文件传输、硬盘休眠${{ matrix.target == 'openwrt' && '、Autocore、Autosamba' || '' }}
          
          ### 📁 固件文件
          EOF
          
          ls -1 ${{ env.FIRMWARE }} 2>/dev/null | grep -E "\.(bin|img\.gz|vmdk|vdi|vhdx|qcow2)$" | sed 's/^/- /' >> release.txt
          
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ Release 描述生成完成"

      # ============================================
      # 16. 创建 Release
      # ============================================
      - name: 创建 Release
        if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ matrix.release_prefix }}-${{ env.date2 }}
          name: ${{ matrix.name }} ${{ env.date3 }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          draft: false
          prerelease: false

      # ============================================
      # 17. 清理
      # ============================================
      - name: 编译后清理
        if: always()
        run: |
          rm -rf ${{ matrix.target }}/build_dir ${{ matrix.target }}/staging_dir ${{ matrix.target }}/tmp 2>/dev/null || true
          echo "=== 最终磁盘空间 ==="
          df -h
