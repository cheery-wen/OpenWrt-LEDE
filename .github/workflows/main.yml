- name: 查看文件结构
  run: |
    echo "=== 当前目录 ==="
    pwd
    echo "=== 所有文件 ==="
    ls -la
    echo "=== openwrt 目录 ==="
    ls -la openwrt/ 2>/dev/null || echo "openwrt 目录不存在"
    echo "=== lede 目录 ==="
    ls -la lede/ 2>/dev/null || echo "lede 目录不存在"
    echo "=== 搜索 diy1.sh ==="
    find . -name "diy1.sh" 2>/dev/null || echo "未找到 diy1.sh"
