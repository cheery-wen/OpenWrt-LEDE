name: 编译 OpenWrt / LEDE

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      target:
        description: '选择编译目标'
        required: true
        default: 'both'
        type: choice
        options:
          - 'openwrt'
          - 'lede'
          - 'both'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPLOAD_RELEASE: true
  UPLOAD_FIRMWARE: true

jobs:
  build:
    name: 编译 ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: openwrt
            name: OpenWrt 官方版
            repo_url: https://github.com/openwrt/openwrt
            repo_branch: main
            config_dir: openwrt-config
            build_dir: openwrt
            release_prefix: openwrt
            default_password: "无"
            
          - target: lede
            name: LEDE
            repo_url: https://github.com/coolsnowwolf/lede
            repo_branch: master
            config_dir: lede-config
            build_dir: lede
            release_prefix: lede
            default_password: "无"

    steps:
      - name: 释放磁盘空间
        run: |
          echo "=== 释放前磁盘空间 ==="
          df -h
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android \
            /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/.ghcup /usr/local/.cargo \
            /usr/local/lib/python3.* /usr/local/aws-sam-cli /usr/local/aws-cli /usr/local/julia* \
            /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/kotlinc /opt/microsoft \
            /opt/google /var/lib/gems /opt/pipx /opt/amazon 2>/dev/null || true
          echo "=== 释放后磁盘空间 ==="
          df -h

      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 设置日期变量
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "date1=$(date +'%Y.%m.%d-%H.%M')" >> $GITHUB_ENV
          echo "date2=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "date3=$(date '+%Y年%m月%d日')" >> $GITHUB_ENV
          echo "✅ 日期: $(date '+%Y年%m月%d日')"

      - name: 安装编译依赖
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential asciidoc binutils bzip2 gawk gettext git \
            libncurses5-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 \
            subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev \
            texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool \
            autopoint device-tree-compiler g++-multilib antlr3 gperf wget curl swig rsync
          echo "✅ 依赖安装完成"
          df -h

      - name: 克隆 ${{ matrix.name }} 源码
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf ${{ matrix.build_dir }}
          git clone --depth 1 ${{ matrix.repo_url }} -b ${{ matrix.repo_branch }} ${{ matrix.build_dir }}
          echo "✅ ${{ matrix.name }} 源码克隆完成"

      - name: 执行 diy1.sh
        run: |
          cd $GITHUB_WORKSPACE
          
          echo "========================================="
          echo "📦 ${{ matrix.name }} 第三方插件清单"
          echo "========================================="
          
          if [ -f "${{ matrix.config_dir }}/diy1.sh" ]; then
            echo "✅ 找到文件: ${{ matrix.config_dir }}/diy1.sh"
            echo ""
            echo "🔍 diy1.sh 中包含的 GitHub 仓库："
            echo "-----------------------------------------"
            grep -E "github\.com|git clone" "${{ matrix.config_dir }}/diy1.sh" 2>/dev/null | \
              grep -v "^#" | head -20 || echo "  (未检测到 git clone 命令)"
            echo "-----------------------------------------"
          else
            echo "❌ 文件不存在: ${{ matrix.config_dir }}/diy1.sh"
          fi
          
          if [ -f "${{ matrix.config_dir }}/feeds.conf.default" ] && [ ! -f "${{ matrix.build_dir }}/feeds.conf.default" ]; then
            cp "${{ matrix.config_dir }}/feeds.conf.default" "${{ matrix.build_dir }}/"
            echo "✅ feeds.conf.default 已复制"
          fi
          
          if [ -f "${{ matrix.config_dir }}/diy1.sh" ]; then
            echo ""
            echo "🚀 开始执行 diy1.sh..."
            echo "========================================="
            chmod +x "${{ matrix.config_dir }}/diy1.sh"
            cd ${{ matrix.build_dir }}
            "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh"
            echo "========================================="
            echo "✅ diy1.sh 执行完成"
          fi

      - name: 更新 feeds
        run: |
          cd $GITHUB_WORKSPACE/${{ matrix.build_dir }}
          echo "=== 更新 feeds ==="
          ./scripts/feeds update -a
          echo "=== 安装 feeds ==="
          ./scripts/feeds install -a
          
          if [ "${{ matrix.target }}" == "lede" ]; then
            echo "=== LEDE: 强制安装关键依赖 ==="
            ./scripts/feeds install rpcd 2>/dev/null || true
            ./scripts/feeds install luci-base 2>/dev/null || true
            ./scripts/feeds install libubus 2>/dev/null || true
            ./scripts/feeds install ucode 2>/dev/null || true
          fi
          
          echo "✅ feeds 更新完成"

      - name: 执行 diy2.sh
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f "${{ matrix.config_dir }}/diy2.sh" ]; then
            echo "🚀 开始执行 diy2.sh..."
            chmod +x "${{ matrix.config_dir }}/diy2.sh"
            cd ${{ matrix.build_dir }}
            "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy2.sh"
            echo "✅ diy2.sh 执行完成"
          else
            echo "⚠️ 跳过 diy2.sh（文件不存在）"
          fi

      - name: 加载配置
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f "${{ matrix.config_dir }}/.config" ]; then
            cp "${{ matrix.config_dir }}/.config" ${{ matrix.build_dir }}/.config
            echo "✅ 配置文件已复制"
          else
            echo "⚠️ 配置文件不存在，使用默认配置"
          fi
          cd ${{ matrix.build_dir }}
          make defconfig
          echo "✅ defconfig 执行完成"

      - name: 验证目标设备
        run: |
          cd $GITHUB_WORKSPACE/${{ matrix.build_dir }}
          echo "=== 目标设备配置 ==="
          grep -E "^CONFIG_TARGET_(x86|mediatek|rockchip|ipq)" .config 2>/dev/null | head -5 || echo "未找到目标设备配置"
          echo ""
          echo "=== IPv6 配置 ==="
          grep -E "^CONFIG_PACKAGE.*ipv6|^CONFIG_PACKAGE.*6in4|^CONFIG_PACKAGE.*6rd|^CONFIG_PACKAGE.*6to4" .config 2>/dev/null | head -5 || echo "IPv6 未完全启用"

      - name: 缓存加速
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ matrix.build_dir }}/dl
            ${{ matrix.build_dir }}/staging_dir
            ${{ matrix.build_dir }}/build_dir
          key: ${{ matrix.target }}-x86-64-${{ hashFiles(format('{0}/.config', matrix.config_dir), format('{0}/diy1.sh', matrix.config_dir), format('{0}/diy2.sh', matrix.config_dir)) 
