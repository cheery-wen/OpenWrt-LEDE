name: 编译 OpenWrt / LEDE

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      target:
        description: '选择编译目标'
        required: true
        default: 'both'
        type: choice
        options:
          - 'openwrt'
          - 'lede'
          - 'both'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPLOAD_RELEASE: true
  UPLOAD_FIRMWARE: true

jobs:
  build:
    name: 编译 ${{ matrix.name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: openwrt
            name: OpenWrt 官方版
            repo_url: https://github.com/openwrt/openwrt
            repo_branch: main
            config_dir: openwrt
            release_prefix: openwrt
            default_password: "无"
            
          - target: lede
            name: LEDE
            repo_url: https://github.com/coolsnowwolf/lede
            repo_branch: master
            config_dir: lede
            release_prefix: lede
            default_password: "无"

    steps:
      - name: 释放磁盘空间
        run: |
          echo "=== 释放前磁盘空间 ==="
          df -h
          sudo apt-get clean
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android \
            /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/.ghcup /usr/local/.cargo \
            /usr/local/lib/python3.* /usr/local/aws-sam-cli /usr/local/aws-cli /usr/local/julia* \
            /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/kotlinc /opt/microsoft \
            /opt/google /var/lib/gems /opt/pipx /opt/amazon 2>/dev/null || true
          echo "=== 释放后磁盘空间 ==="
          df -h

      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 设置日期变量
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "date1=$(date +'%Y.%m.%d-%H.%M')" >> $GITHUB_ENV
          echo "date2=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "date3=$(date '+%Y年%m月%d日')" >> $GITHUB_ENV

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential asciidoc binutils bzip2 gawk gettext git \
            libncurses5-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 \
            subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev \
            texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool \
            autopoint device-tree-compiler g++-multilib antlr3 gperf wget curl swig rsync
          df -h

      - name: 克隆 ${{ matrix.name }} 源码
        run: |
          rm -rf ${{ matrix.target }}
          git clone --depth 1 ${{ matrix.repo_url }} -b ${{ matrix.repo_branch }} ${{ matrix.target }}
          echo "✅ ${{ matrix.name }} 源码克隆完成"

      - name: 执行 diy1.sh
        run: |
          cd ${{ matrix.target }}
          # 避免复制相同文件导致的错误
          if [ -f "../${{ matrix.config_dir }}/feeds.conf.default" ] && [ ! -f "./feeds.conf.default" ]; then
            cp "../${{ matrix.config_dir }}/feeds.conf.default" ./
            echo "✅ feeds.conf.default 已复制"
          fi
          if [ -f "../${{ matrix.config_dir }}/diy1.sh" ]; then
            chmod +x "../${{ matrix.config_dir }}/diy1.sh"
            "../${{ matrix.config_dir }}/diy1.sh"
          fi
          echo "✅ diy1.sh 执行完成"

      - name: 更新 feeds
        run: |
          cd ${{ matrix.target }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "✅ feeds 更新完成"

      - name: 执行 diy2.sh
        run: |
          cd ${{ matrix.target }}
          if [ -f "../${{ matrix.config_dir }}/diy2.sh" ]; then
            chmod +x "../${{ matrix.config_dir }}/diy2.sh"
            "../${{ matrix.config_dir }}/diy2.sh"
          fi
          echo "✅ diy2.sh 执行完成"

      - name: 加载配置
        run: |
          if [ -f "${{ matrix.config_dir }}/.config" ]; then
            cp "${{ matrix.config_dir }}/.config" ${{ matrix.target }}/.config
            echo "✅ 配置文件已复制"
          fi
          cd ${{ matrix.target }}
          make defconfig
          echo "✅ defconfig 执行完成"

      - name: 缓存加速
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ matrix.target }}/dl
            ${{ matrix.target }}/staging_dir
            ${{ matrix.target }}/build_dir
          key: ${{ matrix.target }}-x86-64-${{ hashFiles(format('{0}/.config', matrix.config_dir), format('{0}/diy1.sh', matrix.config_dir), format('{0}/diy2.sh', matrix.config_dir)) }}
          restore-keys: |
            ${{ matrix.target }}-x86-64-
            ${{ matrix.target }}-

      - name: 显示缓存状态
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "✅ 缓存命中！编译将显著加速"
          else
            echo "⚠️ 缓存未命中，将进行完整编译"
          fi

      - name: 下载源码包
        run: |
          cd ${{ matrix.target }}
          echo "=== 下载源码包 ==="
          make download -j8 V=s || make download -j4 V=s || make download -j1 V=s || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;
          make download -j1 V=s 2>/dev/null || true
          echo "✅ 下载完成"

      - name: 编译前清理
        run: |
          cd ${{ matrix.target }}
          rm -rf tmp bin/packages 2>/dev/null || true
          df -h .

      - name: 编译固件
        id: compile
        run: |
          cd ${{ matrix.target }}
          echo "=== 开始编译，使用 $(nproc) 线程 ==="
          
          make -j$(nproc) || make -j1 || make -j1 V=s
          
          BIN_COUNT=$(find bin/targets -name "*.bin" 2>/dev/null | wc -l)
          if [ "$BIN_COUNT" -gt 0 ]; then
            echo "✅ 固件编译成功（生成 $BIN_COUNT 个固件文件）"
          else
            echo "❌ 未找到固件文件"
            exit 1
          fi
          
          make package/index V=s 2>/dev/null || true
          make checksum V=s 2>/dev/null || true
          
          echo "status=success" >> $GITHUB_OUTPUT
          
          grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV || echo "DEVICE_NAME=generic" >> $GITHUB_ENV

      - name: 检查磁盘
        if: (!cancelled())
        run: |
          df -h
          du -sh ${{ matrix.target }} 2>/dev/null || true

      - name: 整理固件
        id: organize
        if: steps.compile.outcome == 'success'
        run: |
          mkdir -p firmware
          
          cp -v ./${{ matrix.target }}/.config firmware/${{ env.date1 }}_${{ matrix.target }}_${{ env.DEVICE_NAME }}.config
          
          find ${{ matrix.target }}/bin/targets -type f \
            \( -name "*.bin" -o -name "*.img.gz" -o -name "*.vmdk" -o -name "*.vdi" \
            -o -name "*.vhdx" -o -name "*.qcow2" -o -name "config.buildinfo" \) \
            -exec cp -v {} firmware/ \; 2>/dev/null || true
          
          cd firmware
          
          for f in *; do
            if [ -f "$f" ]; then
              case "$f" in
                config.buildinfo)
                  mv "$f" "${{ env.date1 }}_${{ matrix.target }}_${{ env.DEVICE
