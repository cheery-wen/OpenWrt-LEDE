name: 编译 OpenWrt / LEDE

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      target:
        description: '选择编译目标'
        required: true
        default: 'both'
        type: choice
        options:
          - 'openwrt'
          - 'lede'
          - 'both'

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPLOAD_RELEASE: true
  UPLOAD_FIRMWARE: true

jobs:
  # ============================================
  # 前置 Job：根据输入生成编译矩阵
  # ============================================
  prepare:
    name: 准备编译矩阵
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: 生成矩阵
        id: set-matrix
        run: |
          TARGET="${{ github.event.inputs.target || 'both' }}"
          if [ "${{ github.event_name }}" == "push" ]; then
            TARGET="both"
          fi

          echo "目标选择: $TARGET"

          if [ "$TARGET" == "openwrt" ]; then
            MATRIX='{"include":[{"target":"openwrt","name":"OpenWrt 官方版","repo_url":"https://github.com/openwrt/openwrt","repo_branch":"main","config_dir":"openwrt-config","build_dir":"openwrt","release_prefix":"openwrt","default_password":"无"}]}'
          elif [ "$TARGET" == "lede" ]; then
            MATRIX='{"include":[{"target":"lede","name":"LEDE","repo_url":"https://github.com/coolsnowwolf/lede","repo_branch":"master","config_dir":"lede-config","build_dir":"lede","release_prefix":"lede","default_password":"无（已清除原密码）"}]}'
          else
            MATRIX='{"include":[{"target":"openwrt","name":"OpenWrt 官方版","repo_url":"https://github.com/openwrt/openwrt","repo_branch":"main","config_dir":"openwrt-config","build_dir":"openwrt","release_prefix":"openwrt","default_password":"无"},{"target":"lede","name":"LEDE","repo_url":"https://github.com/coolsnowwolf/lede","repo_branch":"master","config_dir":"lede-config","build_dir":"lede","release_prefix":"lede","default_password":"无（已清除原密码）"}]}'
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "矩阵配置: $MATRIX"

  # ============================================
  # 编译 Job：根据矩阵动态执行
  # ============================================
  build:
    name: 编译 ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      # ------------------------------------------------------------
      # 1. 环境准备
      # ------------------------------------------------------------
      - name: 释放磁盘空间
        run: |
          echo "=== 释放前磁盘空间 ==="
          df -h
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android \
            /usr/local/lib/node_modules /opt/hostedtoolcache /usr/local/.ghcup /usr/local/.cargo \
            /usr/local/lib/python3.* /usr/local/aws-sam-cli /usr/local/aws-cli /usr/local/julia* \
            /usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/kotlinc /opt/microsoft \
            /opt/google /var/lib/gems /opt/pipx /opt/amazon 2>/dev/null || true
          echo "=== 释放后磁盘空间 ==="
          df -h

      - name: 检出仓库代码
        uses: actions/checkout@v5

      - name: 设置日期变量
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "date1=$(date +'%Y.%m.%d-%H.%M')" >> $GITHUB_ENV
          echo "date2=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "date3=$(date '+%Y年%m月%d日')" >> $GITHUB_ENV
          echo "short_date=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "✅ 日期: $(date '+%Y年%m月%d日')"

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential asciidoc binutils bzip2 gawk gettext git \
            libncurses5-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 \
            subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev \
            texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool \
            autopoint device-tree-compiler g++-multilib antlr3 gperf wget curl swig rsync
          echo "✅ 依赖安装完成"
          df -h

      - name: 升级 CMake
        run: |
          echo "=== 升级 CMake ==="
          sudo apt-get remove -y cmake 2>/dev/null || true
          sudo pip3 install --upgrade cmake
          cmake --version
          echo "✅ CMake 升级完成"

      # ------------------------------------------------------------
      # 2. 克隆源码 & 执行 diy1.sh
      # ------------------------------------------------------------
      - name: 克隆 ${{ matrix.name }} 源码
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf ${{ matrix.build_dir }}
          git clone --depth 1 ${{ matrix.repo_url }} -b ${{ matrix.repo_branch }} ${{ matrix.build_dir }}
          echo "✅ ${{ matrix.name }} 源码克隆完成"

      - name: 执行 diy1.sh
        run: |
          cd $GITHUB_WORKSPACE

          echo "========================================="
          echo "📦 ${{ matrix.name }} 第三方插件清单"
          echo "========================================="

          if [ -f "${{ matrix.config_dir }}/diy1.sh" ]; then
            echo "✅ 找到文件: ${{ matrix.config_dir }}/diy1.sh"
            echo ""
            echo "🔍 diy1.sh 中包含的 GitHub 仓库："
            echo "-----------------------------------------"
            grep -E "github\.com|git clone" "${{ matrix.config_dir }}/diy1.sh" 2>/dev/null | \
              grep -v "^#" | head -20 || echo "  (未检测到 git clone 命令)"
            echo "-----------------------------------------"
          else
            echo "❌ 文件不存在: ${{ matrix.config_dir }}/diy1.sh"
          fi

          if [ -f "${{ matrix.config_dir }}/feeds.conf.default" ]; then
            cp -f "${{ matrix.config_dir }}/feeds.conf.default" "${{ matrix.build_dir }}/"
            echo "✅ feeds.conf.default 已强制覆盖"
          fi

          if [ -f "${{ matrix.config_dir }}/diy1.sh" ]; then
            echo ""
            echo "🚀 开始执行 diy1.sh..."
            echo "========================================="
            chmod +x "${{ matrix.config_dir }}/diy1.sh"
            cd ${{ matrix.build_dir }}
            "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy1.sh"
            echo "========================================="
            echo "✅ diy1.sh 执行完成"
          fi

      # ------------------------------------------------------------
      # 3. 更新 feeds & 执行 diy2.sh
      # ------------------------------------------------------------
      - name: 更新 feeds
        run: |
          cd $GITHUB_WORKSPACE/${{ matrix.build_dir }}
          echo "=== 当前 feeds 配置 ==="
          cat feeds.conf.default 2>/dev/null || echo "未找到 feeds.conf.default"
          echo "=== 更新 feeds ==="
          ./scripts/feeds update -a
          echo "=== 安装 feeds ==="
          ./scripts/feeds install -a

          if [ "${{ matrix.target }}" == "lede" ]; then
            echo "=== LEDE: 强制安装关键依赖 ==="
            ./scripts/feeds install -p lean -a 2>/dev/null || true
            ./scripts/feeds install rpcd 2>/dev/null || true
            ./scripts/feeds install luci-base 2>/dev/null || true
            ./scripts/feeds install libubus 2>/dev/null || true
            ./scripts/feeds install ucode 2>/dev/null || true
          fi

          echo "✅ feeds 更新完成"

      - name: 执行 diy2.sh
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f "${{ matrix.config_dir }}/diy2.sh" ]; then
            echo "🚀 开始执行 diy2.sh..."
            chmod +x "${{ matrix.config_dir }}/diy2.sh"
            cd ${{ matrix.build_dir }}
            "$GITHUB_WORKSPACE/${{ matrix.config_dir }}/diy2.sh"
            echo "✅ diy2.sh 执行完成"
          else
            echo "⚠️ 跳过 diy2.sh（文件不存在）"
          fi

      # ------------------------------------------------------------
      # 4. 加载配置并验证
      # ------------------------------------------------------------
      - name: 加载配置
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f "${{ matrix.config_dir }}/.config" ]; then
            cp "${{ matrix.config_dir }}/.config" ${{ matrix.build_dir }}/.config
            echo "✅ 配置文件已复制"
          else
            echo "⚠️ 配置文件不存在，使用默认配置"
          fi
          cd ${{ matrix.build_dir }}
          make defconfig
          echo "✅ defconfig 执行完成"

      - name: 验证目标设备
        run: |
          cd $GITHUB_WORKSPACE/${{ matrix.build_dir }}
          echo "=== 目标设备配置 ==="
          grep -E "^CONFIG_TARGET_(x86|mediatek|rockchip|ipq)" .config 2>/dev/null | head -5 || echo "未找到目标设备配置"
          echo ""
          echo "=== IPv6 配置 ==="
          grep -E "^CONFIG_PACKAGE.*ipv6|^CONFIG_PACKAGE.*6in4|^CONFIG_PACKAGE.*6rd|^CONFIG_PACKAGE.*6to4" .config 2>/dev/null | head -5 || echo "IPv6 未完全启用"

      # ------------------------------------------------------------
      # 5. 缓存与下载
      # ------------------------------------------------------------
      - name: 缓存加速
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ matrix.build_dir }}/dl
          key: ${{ matrix.target }}-dl-${{ hashFiles(format('{0}/.config', matrix.config_dir), format('{0}/diy1.sh', matrix.config_dir), format('{0}/diy2.sh', matrix.config_dir)) }}
          restore-keys: |
            ${{ matrix.target }}-dl-

      - name: 显示缓存状态
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "✅ 缓存命中！下载包将直接从缓存恢复"
          else
            echo "⚠️ 缓存未命中，将进行完整下载"
          fi

      - name: 下载源码包
        run: |
          cd $GITHUB_WORKSPACE/${{ matrix.build_dir }}
          echo "=== 下载源码包 ==="
          make download -j8 V=s || make download -j4 V=s || make download -j1 V=s || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true
          make download -j1 V=s 2>/dev/null || true
          echo "✅ 下载完成"

      # ------------------------------------------------------------
      # 6. 编译固件
      # ------------------------------------------------------------
      - name: 编译前清理
        run: |
          cd $GITHUB_WORKSPACE/${{ matrix.build_dir }}
          rm -rf tmp bin/packages 2>/dev/null || true
          echo "=== 当前磁盘空间 ==="
          df -h .

      - name: 编译固件
        id: compile
        run: |
          cd $GITHUB_WORKSPACE/${{ matrix.build_dir }}
          echo "=== 开始编译，使用 $(nproc) 线程 ==="

          make -j$(nproc) || make -j1 || make -j1 V=s

          BIN_COUNT=$(find bin/targets -name "*.bin" 2>/dev/null | wc -l)
          if [ "$BIN_COUNT" -gt 0 ]; then
            echo "✅ 固件编译成功（生成 $BIN_COUNT 个固件文件）"
          else
            echo "❌ 未找到固件文件"
            exit 1
          fi

          make package/index V=s 2>/dev/null || true
          make checksum V=s 2>/dev/null || true

          echo "status=success" >> $GITHUB_OUTPUT

          grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV || echo "DEVICE_NAME=generic" >> $GITHUB_ENV
          echo "✅ 设备名称: $(cat DEVICE_NAME 2>/dev/null || echo generic)"

      - name: 检查磁盘使用情况
        if: (!cancelled())
        run: |
          cd $GITHUB_WORKSPACE
          df -h
          du -sh ${{ matrix.build_dir }} 2>/dev/null || true

      # ------------------------------------------------------------
      # 7. 整理固件（仅 squashfs，简化文件名）
      # ------------------------------------------------------------
      - name: 整理固件
        id: organize
        if: steps.compile.outcome == 'success'
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p firmware

          cp -v ./${{ matrix.build_dir }}/.config firmware/${{ matrix.target }}.config

          find ${{ matrix.build_dir }}/bin/targets -type f \
            \( -name "*-squashfs-combined.img.gz" -o -name "*-squashfs-combined-efi.img.gz" \) \
            -exec cp -v {} firmware/ \; 2>/dev/null || true

          cd firmware

          for f in *.img.gz; do
            if [ -f "$f" ]; then
              if echo "$f" | grep -q "efi"; then
                mv "$f" "${{ matrix.target }}-efi.img.gz"
              else
                mv "$f" "${{ matrix.target }}-bios.img.gz"
              fi
            fi
          done

          ls -la

          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ 固件整理完成"

      # ------------------------------------------------------------
      # 8. 上传 Artifact
      # ------------------------------------------------------------
      - name: 上传固件到 Artifact
        if: steps.organize.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}_${{ env.DEVICE_NAME }}_${{ env.date1 }}
          path: ${{ env.FIRMWARE }}

      # ------------------------------------------------------------
      # 9. 生成 Release 并发布
      # ------------------------------------------------------------
      - name: 生成 Release 描述
        id: release
        if: steps.organize.outcome == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          CACHE_STATUS="${{ steps.cache.outputs.cache-hit == 'true' && '✅ 命中' || '⚠️ 未命中' }}"

          cat > release.txt <<EOF
          ## ${{ matrix.name }} 固件

          ### 📥 基本信息
          | 项目 | 值 |
          |------|-----|
          | 默认 IP | 192.168.5.1 |
          | 默认密码 | ${{ matrix.default_password }} |
          | 默认主题 | Argon |
          | 默认语言 | ${{ matrix.target == 'lede' && '简体中文（自带）' || '简体中文' }} |
          | IPv6 | ✅ 已启用 |
          | 内核版本 | ${{ matrix.target == 'lede' && '6.12' || '跟随官方最新' }} |
          | 编译日期 | ${{ env.date3 }} |
          | 缓存状态 | $CACHE_STATUS |

          ### 📦 集成插件
          PassWall、Lucky、关机按钮、访问限制、内存释放、
          DDNS（Cloudflare）、磁盘管理、Samba、TTYD、
          ZeroTier、UDPXY、KMS服务器、文件传输、硬盘休眠

          ### 📁 固件文件（squashfs 格式）
          EOF

          ls -1 ${{ env.FIRMWARE }} 2>/dev/null | grep -E "\.img\.gz$" | sed 's/^/- /' >> release.txt

          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ Release 描述生成完成"

      - name: 创建 Release
        if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ matrix.release_prefix }}-${{ env.date1 }}
          name: ${{ matrix.name }} ${{ env.date3 }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
          draft: false
          prerelease: false

      # ------------------------------------------------------------
      # 10. 善后与日志上传
      # ------------------------------------------------------------
      - name: 准备编译日志
        if: failure()
        run: |
          cd ${{ github.workspace }}
          mkdir -p upload-logs

          if [ -d "${{ matrix.build_dir }}/logs" ]; then
            cp -r ${{ matrix.build_dir }}/logs upload-logs/
            echo "✅ 已复制 logs 目录"
          else
            echo "logs 目录不存在" > upload-logs/MISSING_LOGS.txt
          fi

          if [ -f "${{ matrix.build_dir }}/.config" ]; then
            cp ${{ matrix.build_dir }}/.config upload-logs/
            echo "✅ 已复制 .config 文件"
          else
            echo ".config 文件不存在" > upload-logs/MISSING_CONFIG.txt
          fi

          if [ -f "${{ matrix.build_dir }}/.config.old" ]; then
            cp ${{ matrix.build_dir }}/.config.old upload-logs/
          fi

          ls -la upload-logs/

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}-logs-${{ env.date1 }}
          path: upload-logs/
          if-no-files-found: warn

      - name: 编译后清理
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          rm -rf ${{ matrix.build_dir }}/build_dir ${{ matrix.build_dir }}/staging_dir ${{ matrix.build_dir }}/tmp 2>/dev/null || true
          echo "=== 最终磁盘空间 ==="
          df -h
